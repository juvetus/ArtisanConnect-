services:
  - type: web
    name: artisanconnect-api-frankfurt
    region: frankfurt
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: ORANGE_MONEY_MODE
        value: mock
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administration ArtisanConnect
      - key: DB_HOST
        fromDatabase:
          name: artisanconnect-db-one
          property: host
      - key: DB_PORT
        fromDatabase:
          name: artisanconnect-db-one
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: artisanconnect-db-one
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: artisanconnect-db-one
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: artisanconnect-db-one
          property: database
      - key: DB_SYNCHRONIZE
        value: 'false'
      - key: FRONTEND_URL
        value: https://artisanconnectcm.info
      - key: API_URL
        value: https://artisanconnect-api-frankfurt.onrender.com
      - key: MOMO_MODE
        value: sandbox
      - key: MOMO_BASE_URL
        value: https://sandbox.momodeveloper.mtn.com
      - key: MOMO_TARGET_ENVIRONMENT
        value: sandbox
      - key: MOMO_API_USER
        sync: false
      - key: MOMO_API_KEY
        sync: false
      - key: MOMO_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_WEBHOOK_SECRET
        sync: false
      - key: SMTP_ENABLED
        value: 'true'
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: ArtisanConnect <admin@artisanconnectcm.info>
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: artisanconnect-web
    runtime: node
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://artisanconnect-api-frankfurt.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://artisanconnectcm.info

databases:
  - name: artisanconnect-db-one
    region: frankfurt
    postgresMajorVersion: '18'
    databaseName: artisanconnect_db_one
    user: artisanconnect_db_one_user
