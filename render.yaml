services:
  - type: web
    name: artisanconnect-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: ORANGE_MONEY_MODE
        value: mock
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administration ArtisanConnect
      - key: DB_HOST
        fromDatabase:
          name: artisanconnect-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: artisanconnect-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: artisanconnect-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: artisanconnect-db
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: artisanconnect-db
          property: database
      - key: DB_SYNCHRONIZE
        value: 'true'
      - key: FRONTEND_URL
        value: https://artisanconnect-web.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: artisanconnect-web
    runtime: node
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://artisanconnect-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://artisanconnect-web.onrender.com

databases:
  - name: artisanconnect-db
    databaseName: artisan_connect
    user: artisan
    plan: free
